sonar.projectKey=skol-arena
sonar.projectName=skol-arena
sonar.sources=backend/src,frontend/src,shared/src,docs/src,scripts
sonar.exclusions=**/node_modules/**,**/dist/**,**/dev-dist/**,**/.astro/**,**/coverage/**,backend/drizzle/**,**/components.d.ts,docs/src/content/**,frontend/src/locales/**
sonar.tests=backend/src,frontend/src,scripts,frontend/e2e
sonar.test.inclusions=**/__tests__/**,**/*.test.ts,**/*.spec.ts,frontend/e2e/**
sonar.sourceEncoding=UTF-8
sonar.scm.provider=git
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info,frontend/coverage/lcov.info,shared/coverage/lcov.info,scripts/coverage/lcov.info
# Coverage targets the API and the frontend logic. Left out: bootstrapping and wiring
# with no branching (entrypoints, config, DB schema, migrations runner), generated or
# declarative code (types, i18n catalogues, d.ts), the docs site, and route-level Vue
# views, whose behaviour the Playwright suite exercises.
sonar.coverage.exclusions=docs/**,**/*.d.ts,backend/src/index.ts,backend/src/db/**,backend/src/config/**,backend/src/types/**,backend/src/schemas/**,backend/src/utils/migrate.ts,frontend/src/views/**,frontend/src/App.vue,frontend/src/AppWrapper.vue,frontend/src/main.ts,frontend/src/sw.ts,frontend/src/config/**,frontend/src/test-support/**,frontend/src/types/**,frontend/src/i18n/**,frontend/src/assets/**

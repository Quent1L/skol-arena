name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    if: "!startsWith(github.event.head_commit.message, 'chore(release)')"
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.gate.outputs.proceed }}
      version: ${{ steps.ver.outputs.value }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # No bun-version: setup-bun reads the floor from the root package.json's
      # `engines.bun` instead, so CI and a contributor's machine answer to the same
      # line. Naming `latest` here would silently outrank it.
      - uses: oven-sh/setup-bun@v2

      # Runs before `bun install`: the gate only imports node:child_process and node:fs,
      # so a push that changes nothing shippable pays neither the install nor the build.
      # A commit releases when its type is shippable AND it touches a path outside the
      # denylist -- both on the same commit. See scripts/release-gate.ts.
      - name: Check for releasable commits
        id: gate
        run: bun scripts/release-gate.ts

      - if: steps.gate.outputs.proceed == 'true'
        run: bun install --frozen-lockfile

      - if: steps.gate.outputs.proceed == 'true'
        run: bun run build:shared

      - if: steps.gate.outputs.proceed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # Run the suite as its own step: release-it swallows the pre-commit hook
      # output into a single error string, which GitHub truncates, hiding which
      # test actually failed. HUSKY=0 below stops it running a second time.
      - name: Tests
        if: steps.gate.outputs.proceed == 'true'
        run: bun run test:unit

      - if: steps.gate.outputs.proceed == 'true'
        run: bunx release-it --ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HUSKY: "0"

      - name: Read released version
        if: steps.gate.outputs.proceed == 'true'
        id: ver
        run: echo "value=$(cat VERSION)" >> "$GITHUB_OUTPUT"

  docker:
    needs: release
    if: needs.release.outputs.released == 'true'
    uses: ./.github/workflows/docker-publish.yml
    with:
      tag: ${{ needs.release.outputs.version }}
    secrets: inherit

name: Docker Publish

on:
  workflow_call:
    inputs:
      tag:
        description: Released version to build and publish
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and publish
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            quent1l/skol-arena:${{ inputs.tag }}
            quent1l/skol-arena:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

# Dex for the SSO e2e suite: the plainest OpenID Connect provider there is.
# Dex publishes no end_session_endpoint, so a logout stays local to Skol Arena.
issuer: http://localhost:5556/dex

storage:
  type: memory

web:
  http: 0.0.0.0:5556

oauth2:
  skipApprovalScreen: true

enablePasswordDB: true

staticClients:
  - id: skol-arena
    secret: skol-e2e-secret
    name: Skol Arena
    redirectURIs:
      - http://localhost:3000/api/auth/callback/dex


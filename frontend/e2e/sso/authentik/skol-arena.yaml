# Authentik for the SSO e2e suite: provider, application and the two test users.
# Applied by the worker at startup (mounted into /blueprints/custom).
version: 1
metadata:
  name: Skol Arena e2e
entries:
  - model: authentik_providers_oauth2.oauth2provider
    id: skol-provider
    identifiers:
      name: skol-arena
    attrs:
      authorization_flow:
        !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      # The default provider invalidation flow only logs out of the application, the
      # authentik session survives it. This one ends it (user logout stage).
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-invalidation-flow]]
      client_type: confidential
      client_id: skol-arena
      client_secret: skol-e2e-secret
      # Required: a provider created by blueprint enables no grant type by default.
      grant_types:
        - authorization_code
        - refresh_token
      redirect_uris:
        - matching_mode: strict
          url: http://localhost:3000/api/auth/callback/authentik
          redirect_uri_type: authorization
        - matching_mode: strict
          url: http://localhost:5173/login
          redirect_uri_type: logout
      property_mappings:
        - !Find [
            authentik_providers_oauth2.scopemapping,
            [managed, goauthentik.io/providers/oauth2/scope-openid],
          ]
        - !Find [
            authentik_providers_oauth2.scopemapping,
            [managed, goauthentik.io/providers/oauth2/scope-email],
          ]
        - !Find [
            authentik_providers_oauth2.scopemapping,
            [managed, goauthentik.io/providers/oauth2/scope-profile],
          ]
      signing_key:
        !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]

  - model: authentik_core.application
    identifiers:
      slug: skol-arena
    attrs:
      name: Skol Arena
      provider: !KeyOf skol-provider

  # Password for both: SsoE2ePass123!
  - model: authentik_core.user
    identifiers:
      username: sso-new
    attrs:
      name: Sso Newcomer
      email: sso-new@skol.test
      password: SsoE2ePass123!

  - model: authentik_core.user
    identifiers:
      username: sso-link
    attrs:
      name: E2E Player Four
      email: e2e-player4@skol.test
      password: SsoE2ePass123!

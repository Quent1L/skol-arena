<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!-- These three are deliberately not manifest icons: the browser and iOS pick
         them up from here, so the manifest stays down to what Chromium reads. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <!-- viewport-fit=cover: full-screen overlays reach the physical bottom of the
         screen, and env(safe-area-inset-*) starts resolving to real values. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000006" />
    <title>Skol Arena</title>
    <meta name="description" content="Skol Arena - Skill Or Luck ?" />
    <style>
      /* Painted before any bundle is parsed, so the first frame is already the
         brand's black rather than the browser's white. Same colour as the PWA
         manifest background and SplashLoader, which makes boot one continuous
         surface instead of three flashes. */
      html,
      body {
        margin: 0;
        background: #000006;
      }

      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      #boot svg {
        width: 84px;
        height: auto;
        animation: boot-pulse 1.6s ease-in-out infinite;
      }

      @keyframes boot-pulse {
        0%,
        100% {
          opacity: 0.55;
          transform: scale(0.97);
        }
        50% {
          opacity: 1;
          transform: scale(1);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #boot svg {
          animation: none;
          opacity: 0.85;
        }
      }
    </style>
  </head>
  <body>
    <!-- Lives inside #app on purpose: Vue clears the mount container, so the
         boot screen is removed the moment the real splash can take over. -->
    <div id="app" class="isolate">
      <div id="boot">
        <svg viewBox="29.5500 10.8500 107.5400 162.3500" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs><linearGradient id="bootMark" gradientUnits="userSpaceOnUse" x1="0" y1="19" x2="0" y2="165"><stop offset="0" stop-color="#DC9FFC"/><stop offset="0.35" stop-color="#C57DFB"/><stop offset="0.7" stop-color="#A85CF8"/><stop offset="1" stop-color="#8B5CF6"/></linearGradient></defs><path fill="url(#bootMark)" d="M 131.09 48.68 L 83.37 16.85 L 35.61 49.18 L 35.55 76.77 L 70.93 99.79 L 86.67 89.15 L 83.85 86.64 L 52.8 66.98 L 52.9 58.62 L 83.44 37.97 L 116.35 59.53 Z"/><path fill="url(#bootMark)" d="M 74.48 67.52 L 80.69 71.9 L 111.11 90.81 L 110.72 96.39 L 68.97 123.72 L 69.8 126.65 L 82.36 136.35 L 129.01 105.78 L 129.14 81.01 L 90.82 56.29 Z"/><path fill="url(#bootMark)" d="M 68.38 154.48 L 82.37 167.2 L 95.7 154.45 L 81.98 142.18 Z"/></svg>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
